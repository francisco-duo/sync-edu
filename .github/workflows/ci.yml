name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL REAL (nada de SQLite): os testes de integração usam este container.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edu_sync
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edu_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_sync -d edu_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://edu_sync:ci-only-password@localhost:5432/edu_sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes unitários
        run: pytest
      - name: Testes de integração (PostgreSQL real)
        run: pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria o .env a partir do exemplo
        run: cp .env.example .env
      - name: Sobe a stack e espera ficar saudável
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derruba a stack
        if: always()
        run: docker compose down --volumes
