[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-academico"
version = "0.1.0"
description = "Mock do sistema acadêmico (fonte da verdade fictícia) do edu-sync."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_academico"]
