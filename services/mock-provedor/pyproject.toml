[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-provedor"
version = "0.1.0"
description = "Mock do provedor externo de contas e turmas do edu-sync."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_provedor"]
