[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sync-service"
version = "0.1.0"
description = "Sincronizador entre sistema acadêmico e provedor de contas (edu-sync)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sync_service"]
