# Pré-requisito: cp .env.example .env   (as variáveis obrigatórias vêm de lá)
#
# Dentro da rede "edu-sync" os serviços se enxergam pelo NOME do serviço:
#   http://mock-academico:8000 · http://mock-provedor:8000 · postgres:5432
# As portas do host (8000/8001/8002/5433) existem só para você acessar de fora e ficam presas
# a 127.0.0.1: os serviços não têm autenticação e o banco usa a senha do seu .env.

name: edu-sync

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edu-sync]

  mock-academico:
    build: ./services/mock-academico
    environment:
      SEED_STUDENTS: ${SEED_STUDENTS:-20}
      SEED_CLASSES: ${SEED_CLASSES:-3}
    ports:
      - "127.0.0.1:${MOCK_ACADEMICO_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edu-sync]

  mock-provedor:
    build: ./services/mock-provedor
    environment:
      CHAOS_ERROR_RATE: ${PROVEDOR_CHAOS_ERROR_RATE:-0}
      CHAOS_LOSE_RESPONSE_RATE: ${PROVEDOR_CHAOS_LOSE_RESPONSE_RATE:-0}
      CHAOS_RETRY_AFTER_SECONDS: ${PROVEDOR_CHAOS_RETRY_AFTER_SECONDS:-1}
      CHAOS_RATE_LIMIT_RPS: ${PROVEDOR_CHAOS_RATE_LIMIT_RPS:-0}
      CHAOS_LATENCY_MS: ${PROVEDOR_CHAOS_LATENCY_MS:-0}
    ports:
      - "127.0.0.1:${MOCK_PROVEDOR_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edu-sync]

  sync-service:
    build: ./services/sync-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACADEMICO_BASE_URL: http://mock-academico:8000
      PROVEDOR_BASE_URL: http://mock-provedor:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-5}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-0.5}
      RETRY_FACTOR: ${RETRY_FACTOR:-2}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
      RETRY_JITTER: ${RETRY_JITTER:-full}
      RETRY_MAX_ELAPSED_SECONDS: ${RETRY_MAX_ELAPSED_SECONDS:-120}
      PROVIDER_CONCURRENCY: ${PROVIDER_CONCURRENCY:-10}
      SNAPSHOT_CONCURRENCY: ${SNAPSHOT_CONCURRENCY:-5}
      PROVIDER_MAX_RPS: ${PROVIDER_MAX_RPS:-0}
      BATCH_SIZE: ${BATCH_SIZE:-200}
      MAX_CONSECUTIVE_FAILURES: ${MAX_CONSECUTIVE_FAILURES:-25}
    ports:
      - "127.0.0.1:${SYNC_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-academico:
        condition: service_healthy
      mock-provedor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edu-sync]

volumes:
  pgdata:

networks:
  edu-sync:
    name: edu-sync
